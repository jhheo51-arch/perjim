<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이 브라우저에 저장된 2차 메시지 검증 응답을 읽는 운영자용 화면">
  <title>한 달의 이유 — 2차 응답 검토</title>
  <link rel="stylesheet" href="./src/message-check.css">
  <style>
    html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
    main{max-width:960px}.intro h1{font-size:clamp(42px,6vw,72px)}
    .review-note{margin:28px 0;padding:18px 20px;border-radius:16px;background:var(--soft);color:var(--sub)}
    .review-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}
    .review-summary article,.response-card{padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff}
    .review-summary span{display:block;color:var(--sub);font-size:13px}.review-summary strong{display:block;margin-top:8px;font-size:24px}
    .responses{display:grid;gap:14px}.response-card h2{margin:0 0 14px}.response-card dl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}.response-card dt{color:var(--sub);font-size:13px}.response-card dd{margin:3px 0 0;font-weight:800}
    .response-card p{margin:12px 0 0}.response-card p strong{display:block;margin-bottom:3px}.empty{padding:30px;border:1px solid var(--line);border-radius:18px;background:#fff}
    .review-back{display:inline-block;margin-top:30px;color:var(--blue);font-weight:800}
    @media(max-width:650px){.review-summary{grid-template-columns:1fr}.response-card dl{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><a href="./index.html" class="brand">TREND TO TRUST</a><span>MESSAGE TEST · 02 REVIEW</span></header>
  <main>
    <section class="intro">
      <p class="eyebrow">LOCAL RESPONSE REVIEW</p>
      <h1>2차 응답을<br><em>그대로 읽습니다.</em></h1>
      <p>이 화면은 현재 브라우저에 저장된 응답만 보여줍니다. 이름과 연락처는 수집하지 않습니다.</p>
    </section>
    <p class="review-note">서술형 답변에는 개인적인 내용이 있을 수 있습니다. 공개 포트폴리오에는 원문을 복사하지 말고, 반복된 의견과 판단의 한계만 정리해 주세요.</p>
    <section id="reviewSummary" class="review-summary" aria-label="2차 검증 요약"></section>
    <section id="responses" class="responses" aria-label="참여자별 응답"></section>
    <a class="review-back" href="./message-check-02.html">2차 검증 화면으로 돌아가기</a>
  </main>
  <script type="module" src="./src/message-check-02-review.js"></script>
</body>
</html>
